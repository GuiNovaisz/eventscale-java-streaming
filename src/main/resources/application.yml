spring:
  application:
    name: eventscale
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventscale}
    username: ${DB_USER:eventscale}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 64KB
    connection-timeout: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,kafka
logging:
  structured:
    format:
      console: logstash
  level:
    org.apache.kafka: WARN
eventscale:
  projection-version: ${PROJECTION_VERSION:v1}
  normalizer-enabled: ${NORMALIZER_ENABLED:true}
  projectors-enabled: ${PROJECTORS_ENABLED:true}
