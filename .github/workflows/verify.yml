name: Verify
on:
  push:
    branches: [feature/event-streaming-foundation, dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            target/surefire-reports/
            target/failsafe-reports/
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral database password
        shell: bash
        run: echo "DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: docker compose down -v && docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke
        shell: pwsh
        run: ./scripts/smoke.ps1
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Clean task containers
        if: always()
        run: docker compose down -v
