name: eventscale
services:
  kafka:
    image: apache/kafka:4.4.0
    mem_limit: 1200m
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_MAX_DECOMPRESSED_MESSAGE_BYTES: 131072
      KAFKA_MESSAGE_MAX_BYTES: 131072
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
  postgres:
    image: postgres:18.7-alpine
    mem_limit: 384m
    environment:
      POSTGRES_DB: eventscale
      POSTGRES_USER: eventscale
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventscale -d eventscale"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    image: eventscale:0.1.0-dev
    mem_limit: 768m
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/eventscale
      DB_USER: eventscale
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
volumes:
  kafka-data:
  postgres-data:
